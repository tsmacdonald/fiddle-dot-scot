# site settings
title: fiddle.scot
email: tim@tsmacdonald.com
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://fiddle.scot" # the base hostname & protocol for your site
author: "Tim Macdonald"
locale: en_GB
formspree: xwkykgll
goatcounter: fiddle-scot

theme: hitchens-theme

plugins:
  - jekyll-paginate
  - jekyll-seo-tag

# The blog's table of contents lives at /blog/ (blog/index.html)
paginate: 10
paginate_path: "/blog/page:num/"
show_excerpts: true

markdown: kramdown

sass:
  style: compressed
  # The theme's partials share globals via @import and use lighten()/darken(),
  # so they can't move to @use without forking the theme. Silence until it's updated.
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

exclude:
- LICENSE.md
- README.md
- mise.toml
- .gitlab-ci.yml
