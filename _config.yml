# site settings
title: fiddle.scot
email: tim@tsmacdonald.com
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://fiddle.scot" # the base hostname & protocol for your site
author: "Tim Macdonald"
formspree: xwkykgll
goatcounter: fiddle-scot

theme: hitchens-theme

plugins:
  - jekyll-paginate

# The blog's table of contents lives at /blog/ (blog/index.html)
paginate: 10
paginate_path: "/blog/page:num/"
show_excerpts: true

markdown: kramdown

sass:
  style: compressed

exclude:
- LICENSE.md
- README.md
- mise.toml
- .gitlab-ci.yml
